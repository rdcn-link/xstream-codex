name: Climate array preview
steps:
  - id: read
    operator: item_source@1.0
    inputs: {}
    params:
      uri: context:/local_files/scientific/climate.nc/temperature
      view: array
      selection:
        origin: [0, 0]
        shape: [2, 3]
        stride: [1, 1]
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: read
