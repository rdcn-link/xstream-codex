name: FASTQ sequence lengths
steps:
  - id: read
    operator: item_source@1.0
    inputs: {}
    params: {uri: 'context:/galaxy/reads.fastq', view: bytes}
  - id: fasta
    operator: galaxy_fastq_to_fasta@1.0
    inputs: {source: read}
    params: {encoding: sanger33}
  - id: lengths
    operator: galaxy_fasta_length@1.0
    inputs: {source: fasta}
    params: {id_only: true}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: lengths
