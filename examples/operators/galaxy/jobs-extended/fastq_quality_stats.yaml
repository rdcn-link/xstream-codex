name: Summarize per-position FASTQ quality quartiles and nucleotide counts.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/fastq_quality_stats.txt
    view: bytes
- id: process
  operator: galaxy_fastq_quality_stats@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
