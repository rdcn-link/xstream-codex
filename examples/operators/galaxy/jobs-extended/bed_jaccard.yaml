name: Compute base-pair Jaccard similarity of two interval sets.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_jaccard.txt
    view: bytes
- id: read_reference
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_jaccard-reference.txt
    view: bytes
- id: process
  operator: galaxy_bed_jaccard@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
outputs:
  result: process
