name: Report nucleotide composition of BED-selected FASTA regions.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_nucleotide_content.txt
    view: bytes
- id: read_reference
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_nucleotide_content-reference.txt
    view: bytes
- id: process
  operator: galaxy_bed_nucleotide_content@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
