name: Extract sample genotypes into long-form TSV.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/vcf_genotype_table.txt
    view: bytes
- id: process
  operator: galaxy_vcf_genotype_table@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
