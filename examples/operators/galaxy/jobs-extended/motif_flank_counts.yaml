name: Count motif-bearing windows upstream and downstream of each indel.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/motif_flank_counts.txt
    view: bytes
- id: process
  operator: galaxy_motif_flank_counts@1.0
  inputs:
    source: read
  params:
    motifs:
    - AC
    windows: 1
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
