name: Sort BED records lexically by chromosome and numerically by start.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_sort.txt
    view: bytes
- id: process
  operator: galaxy_bed_sort@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
