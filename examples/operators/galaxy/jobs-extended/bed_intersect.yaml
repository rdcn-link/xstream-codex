name: Emit pairwise clipped overlaps between two BED streams.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_intersect.txt
    view: bytes
- id: read_reference
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_intersect-reference.txt
    view: bytes
- id: process
  operator: galaxy_bed_intersect@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
outputs:
  result: process
