name: Sort the tab-separated fields within each row alphabetically.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/sort_fields.txt
    view: bytes
- id: process
  operator: galaxy_sort_fields@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
