name: Convert RGB BED9 bands into Circos band definitions.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/circos_cytobands.txt
    view: bytes
- id: process
  operator: galaxy_circos_cytobands@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
