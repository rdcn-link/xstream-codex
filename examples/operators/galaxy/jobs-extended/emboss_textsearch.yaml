name: Find literal text in FASTA identifiers and descriptions.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_textsearch.txt
    view: bytes
- id: process
  operator: galaxy_emboss_textsearch@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
