name: Expand a delimited list in one tab-separated field into multiple rows.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/unfold_column.txt
    view: bytes
- id: process
  operator: galaxy_unfold_column@1.0
  inputs:
    source: read
  params:
    column: 2
    separator: ;
outputs:
  result: process
