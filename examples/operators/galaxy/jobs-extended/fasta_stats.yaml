name: Compute scaffold, contig and base-composition summary statistics from FASTA.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/fasta_stats.txt
    view: bytes
- id: process
  operator: galaxy_fasta_stats@1.0
  inputs:
    source: read
  params:
    genome_size: 0
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
