name: Compute run-length encoded BED coverage as bedGraph.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_genome_coverage.txt
    view: bytes
- id: process
  operator: galaxy_bed_genome_coverage@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
