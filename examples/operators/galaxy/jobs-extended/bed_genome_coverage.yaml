name: Compute run-length encoded BED coverage as bedGraph.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_genome_coverage.txt
    view: bytes
- id: process
  operator: galaxy_bed_genome_coverage@1.0
  inputs:
    source: read
  params: {}
outputs:
  result: process
