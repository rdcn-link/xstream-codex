name: Convert flat GFF3 features to sorted Circos tile records.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/circos_tiles_gff3.txt
    view: bytes
- id: process
  operator: galaxy_circos_tiles_gff3@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
