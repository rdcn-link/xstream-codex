name: Expand one or two pgSnp alleles, frequencies and scores into separate columns.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/divide_pg_snp.txt
    view: bytes
- id: process
  operator: galaxy_divide_pg_snp@1.0
  inputs:
    source: read
  params:
    reference_column: 0
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
