name: Find similar sequence windows using a bounded dot-plot score.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_dotmatcher.txt
    view: bytes
- id: read_reference
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_dotmatcher-reference.txt
    view: bytes
- id: process
  operator: galaxy_emboss_dotmatcher@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
