name: Translate stop-delimited ORFs in forward reading frames.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_getorf.txt
    view: bytes
- id: process
  operator: galaxy_emboss_getorf@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
