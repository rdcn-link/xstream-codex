name: Report overlap count and covered query bases.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_coverage.txt
    view: bytes
- id: read_reference
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_coverage-reference.txt
    view: bytes
- id: process
  operator: galaxy_bed_coverage@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
outputs:
  result: process
