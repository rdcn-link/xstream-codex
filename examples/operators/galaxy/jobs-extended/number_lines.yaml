name: Number nonempty text lines with configurable starting number, increment and
  alignment.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/number_lines.txt
    view: bytes
- id: process
  operator: galaxy_number_lines@1.0
  inputs:
    source: read
  params:
    start: 1
    increment: 1
    width: 3
    style: rz
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
