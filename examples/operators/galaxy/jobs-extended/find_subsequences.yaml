name: Find IUPAC nucleotide motifs in FASTA and emit zero-based half-open BED6 locations.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/find_subsequences.txt
    view: bytes
- id: process
  operator: galaxy_find_subsequences@1.0
  inputs:
    source: read
  params:
    pattern: AC
    strand: both
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
