name: Convert labeled BED intervals to Circos text records.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/circos_text_bed.txt
    view: bytes
- id: process
  operator: galaxy_circos_text_bed@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
