name: Extract FASTA subsequences for BED intervals.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_extract_fasta.txt
    view: bytes
- id: read_reference
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_extract_fasta-reference.txt
    view: bytes
- id: process
  operator: galaxy_bed_extract_fasta@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
