name: Group SAM records sharing the same query name.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/sam_collate.txt
    view: bytes
- id: process
  operator: galaxy_sam_collate@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
