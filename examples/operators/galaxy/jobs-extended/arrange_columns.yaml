name: Reorder table columns by their header names, optionally discarding unselected
  columns.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/arrange_columns.txt
    view: bytes
- id: process
  operator: galaxy_arrange_columns@1.0
  inputs:
    source: read
  params:
    names:
    - C
    - A
    discard: false
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
