name: Compare two coding sequences by normalized codon distributions.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_codcmp.txt
    view: bytes
- id: read_reference
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_codcmp-reference.txt
    view: bytes
- id: process
  operator: galaxy_emboss_codcmp@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
outputs:
  result: process
