name: Remove trailing standard-code stop codons from nucleotide FASTA.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/remove_terminal_stop_codons.txt
    view: bytes
- id: process
  operator: galaxy_remove_terminal_stop_codons@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
