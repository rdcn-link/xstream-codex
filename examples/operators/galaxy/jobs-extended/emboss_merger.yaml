name: Assemble two DNA sequences at their longest exact suffix-prefix overlap.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_merger.txt
    view: bytes
- id: read_reference
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_merger-reference.txt
    view: bytes
- id: process
  operator: galaxy_emboss_merger@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
