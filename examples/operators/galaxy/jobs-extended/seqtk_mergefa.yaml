name: Merge paired FASTA sequences using IUPAC allele unions.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/seqtk_mergefa.txt
    view: bytes
- id: read_reference
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/seqtk_mergefa-reference.txt
    view: bytes
- id: process
  operator: galaxy_seqtk_mergefa@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
