name: Report all nearest same-chromosome reference features per query.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_closest.txt
    view: bytes
- id: read_reference
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_closest-reference.txt
    view: bytes
- id: process
  operator: galaxy_bed_closest@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
outputs:
  result: process
