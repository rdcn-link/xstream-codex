name: Interleave two corresponding four-line FASTQ streams.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/seqtk_mergepe.txt
    view: bytes
- id: read_reference
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/seqtk_mergepe-reference.txt
    view: bytes
- id: process
  operator: galaxy_seqtk_mergepe@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
