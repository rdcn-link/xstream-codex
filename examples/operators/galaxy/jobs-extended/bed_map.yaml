name: Aggregate a numeric reference column over query overlaps.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_map.txt
    view: bytes
- id: read_reference
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/bed_map-reference.txt
    view: bytes
- id: process
  operator: galaxy_bed_map@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
outputs:
  result: process
