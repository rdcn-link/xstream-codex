name: Count valid feature records in a GFF stream.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/count_gff_features.txt
    view: bytes
- id: process
  operator: galaxy_count_gff_features@1.0
  inputs:
    source: read
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
