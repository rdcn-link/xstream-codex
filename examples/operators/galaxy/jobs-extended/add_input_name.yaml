name: Add an input label as a new table column, with optional header and prepending.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/add_input_name.txt
    view: bytes
- id: process
  operator: galaxy_add_input_name@1.0
  inputs:
    source: read
  params:
    label: run1
    header: sample
    prepend: true
outputs:
  result: process
