name: Insert one DNA sequence at a specified boundary of another.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_pasteseq.txt
    view: bytes
- id: read_reference
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_pasteseq-reference.txt
    view: bytes
- id: process
  operator: galaxy_emboss_pasteseq@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
