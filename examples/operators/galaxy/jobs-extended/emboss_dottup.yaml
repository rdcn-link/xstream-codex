name: Find all exact word matches between two DNA sequences.
steps:
- id: read
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_dottup.txt
    view: bytes
- id: read_reference
  operator: read_item@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/emboss_dottup-reference.txt
    view: bytes
- id: process
  operator: galaxy_emboss_dottup@1.0
  inputs:
    source: read
    reference: read_reference
  params: {}
outputs:
  result: process
