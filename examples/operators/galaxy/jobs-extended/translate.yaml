name: Translate nucleotide FASTA to protein FASTA with the standard genetic code.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/translate.txt
    view: bytes
- id: process
  operator: galaxy_translate@1.0
  inputs:
    source: read
  params:
    to_stop: false
    cds: false
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
