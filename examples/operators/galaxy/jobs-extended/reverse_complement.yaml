name: Reverse-complement FASTA nucleotide sequences using the IUPAC alphabet.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/reverse_complement.txt
    view: bytes
- id: process
  operator: galaxy_reverse_complement@1.0
  inputs:
    source: read
  params:
    alphabet: dna
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
