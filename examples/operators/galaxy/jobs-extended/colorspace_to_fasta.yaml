name: Convert FASTA-like SOLiD color-space sequences to nucleotide FASTA.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/colorspace_to_fasta.txt
    view: bytes
- id: process
  operator: galaxy_colorspace_to_fasta@1.0
  inputs:
    source: read
  params:
    keep_prefix: true
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
