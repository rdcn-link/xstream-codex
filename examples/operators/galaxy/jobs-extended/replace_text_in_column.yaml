name: Replace literal text within one tab-separated field.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/extended/replace_text_in_column.txt
    view: bytes
- id: process
  operator: galaxy_replace_text_in_column@1.0
  inputs:
    source: read
  params:
    find: cat
    replacement: dog
    first_only: false
    ignore_case: false
    skip_header: false
    column: 1
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
