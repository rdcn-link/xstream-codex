name: Convert tab-separated title and sequence columns to FASTA entries; skip rows
  missing selected fields.
steps:
- id: read
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/galaxy/sequence-table.tsv
    view: bytes
- id: process
  operator: galaxy_tabular_to_fasta@1.0.1
  inputs:
    source: read
  params:
    title_columns: '1'
    sequence_column: 2
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: process
