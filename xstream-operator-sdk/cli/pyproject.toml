[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xstream-operator-tools"
version = "0.1.0"
description = "Operator templates, checks, local builds and submission for XStream operators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
xstream-operator = "xstream_operator_cli.cli:main"

[tool.setuptools]
packages = ["xstream_operator_cli"]
