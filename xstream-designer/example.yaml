host: 127.0.0.1
port: 8840
# Optional natural-language Job design; key is read only by the server.
# chat:
#   url: https://model.example/v1/chat/completions
#   model: your-model
#   token_env: XSTREAM_MODEL_API_KEY
repository:
  url: http://localhost:8820

# Local, on-demand schema inference workers (Docker access required).
operator_cache: .designer-operator-cache
operator_max_bytes: 8589934592
inference_workers:
  max_workers: 4
  idle_seconds: 60
  timeout_seconds: 60

# Catalog shared by the designer JVM; descendants are loaded only on expansion.
local_catalog:
  datasets:
    weather:
      provider: directory
      source:
        root: examples/data
# Optional remote data connections; local design works without them.
nodes: []

# Optional website showcase; first-time visitors load this validated draft automatically.
# showcase:
#   job_file: /srv/demo/showcase.yaml
#   variables_file: /srv/demo/variables.yaml
#   label: Load demo
