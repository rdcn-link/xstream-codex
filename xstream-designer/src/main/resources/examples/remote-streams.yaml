name: Combine local and remote observations
steps:
- id: left
  title: Read observations
  operator: read_item@1.0
  inputs: {}
  params:
    uri: $LOCAL_ITEM
    view: records
- id: right
  title: Read observations
  operator: read_item@1.0
  inputs: {}
  params:
    uri: $REMOTE_ITEM
    view: records
- id: merge
  operator: piflow_merge@1.2
  inputs:
    left: left
    right: right
  params: {}
- id: csv
  operator: piflow_csv_save@1.2
  inputs:
    source: merge
  params:
    header: true
outputs:
  result: csv
designer:
  version: 1
  target: local
