name: Filter warm observations and stream CSV
steps:
- id: read
  title: Read observations
  operator: item_source@1.0
  inputs: {}
  params:
    uri: context:/weather/weather-observations.jsonl
    view: records
- id: filter
  operator: piflow_filter@2.0
  inputs:
    source: read
  params:
    condition: CAST(temperature_c AS REAL) >= 25
- id: csv
  operator: piflow_csv_save@2.0
  inputs:
    source: filter
  params:
    header: true
- id: client_sink
  operator: client_sink@1.0
  inputs:
    result: csv
designer:
  version: 1
  target: local
